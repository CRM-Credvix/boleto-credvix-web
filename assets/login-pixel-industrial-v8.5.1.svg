<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" aria-hidden="true">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050605"/>
      <stop offset=".5" stop-color="#0b0906"/>
      <stop offset="1" stop-color="#050504"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#211b14"/>
      <stop offset=".35" stop-color="#0c0d0c"/>
      <stop offset=".7" stop-color="#2b2116"/>
      <stop offset="1" stop-color="#090a09"/>
    </linearGradient>
    <linearGradient id="goldMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c87914"/>
      <stop offset=".22" stop-color="#5f3511"/>
      <stop offset=".55" stop-color="#1b150e"/>
      <stop offset=".82" stop-color="#7a4311"/>
      <stop offset="1" stop-color="#d58316"/>
    </linearGradient>
    <linearGradient id="sunset" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#31224f"/>
      <stop offset=".4" stop-color="#b03c2e"/>
      <stop offset=".68" stop-color="#f28d20"/>
      <stop offset="1" stop-color="#221016"/>
    </linearGradient>
    <linearGradient id="honey" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffcf4a" stop-opacity=".23"/>
      <stop offset=".38" stop-color="#f5a20f" stop-opacity=".6"/>
      <stop offset="1" stop-color="#8f3e00" stop-opacity=".2"/>
    </linearGradient>
    <radialGradient id="amberGlow">
      <stop offset="0" stop-color="#fff0a0" stop-opacity="1"/>
      <stop offset=".2" stop-color="#ffd044" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#ff9500" stop-opacity=".38"/>
      <stop offset="1" stop-color="#ff9500" stop-opacity="0"/>
    </radialGradient>
    <pattern id="microgrid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M18 0H0V18" fill="none" stroke="#1d1812" stroke-width="1"/>
    </pattern>
    <pattern id="hex" width="48" height="42" patternUnits="userSpaceOnUse">
      <path d="M12 1h24l11 20-11 20H12L1 21 12 1z" fill="none" stroke="#7c4b17" stroke-width="2" opacity=".42"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="15" stdDeviation="18" flood-color="#000" flood-opacity=".8"/>
    </filter>
  </defs>

  <rect width="1672" height="941" fill="url(#wall)"/>
  <rect width="1672" height="941" fill="url(#microgrid)" opacity=".65"/>

