<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">C pixel neon</title>
  <desc id="desc">Símbolo C em pixel art com degradê azul, roxo e rosa.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset=".38" stop-color="#2494ff"/>
      <stop offset=".72" stop-color="#8c4dff"/>
      <stop offset="1" stop-color="#ff2aa8"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)" fill="url(#g)">
    <rect x="20" y="12" width="44" height="8"/>
    <rect x="12" y="20" width="60" height="8"/>
    <rect x="8" y="28" width="24" height="40"/>
    <rect x="12" y="68" width="60" height="8"/>
    <rect x="20" y="76" width="44" height="8"/>
    <rect x="64" y="20" width="12" height="8"/>
    <rect x="64" y="68" width="12" height="8"/>
  </g>
  <g fill="#dffbff" opacity=".45">
    <rect x="20" y="12" width="28" height="3"/>
    <rect x="12" y="20" width="22" height="3"/>
    <rect x="8" y="28" width="4" height="24"/>
  </g>
</svg>
