<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 650" role="img" aria-labelledby="title desc">
  <title id="title">Boleto e WhatsApp em pedestal neon</title>
  <desc id="desc">Ilustração futurista de um boleto e um símbolo de WhatsApp sobre uma base iluminada.</desc>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16dcff"/><stop offset=".46" stop-color="#337cff"/><stop offset=".72" stop-color="#8448ff"/><stop offset="1" stop-color="#ff2ba8"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#172757"/><stop offset="1" stop-color="#09112d"/>
    </linearGradient>
    <radialGradient id="wa" cx="38%" cy="32%" r="70%">
      <stop stop-color="#45ffbd"/><stop offset=".5" stop-color="#11d77b"/><stop offset="1" stop-color="#036c52"/>
    </radialGradient>
    <filter id="glowBlue" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowPink" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow" x="-80%" y="-80%" width="260%" height="260%"><feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#000" flood-opacity=".62"/></filter>
  </defs>

  <g opacity=".75">
    <circle cx="370" cy="290" r="192" fill="none" stroke="#1e7bff" stroke-opacity=".16"/>
    <circle cx="370" cy="290" r="156" fill="none" stroke="#ef2cff" stroke-opacity=".14"/>
    <path d="M91 506H750" stroke="#257fff" stroke-opacity=".15"/>
    <path d="M111 542H730" stroke="#ff2aa8" stroke-opacity=".12"/>
  </g>

  <g opacity=".9">
    <rect x="105" y="210" width="8" height="8" fill="#11d9ff" filter="url(#glowBlue)"/>
    <rect x="690" y="225" width="10" height="10" fill="#ff2aa8" filter="url(#glowPink)"/>
    <rect x="666" y="178" width="6" height="6" fill="#8157ff"/>
    <rect x="167" y="142" width="6" height="6" fill="#3290ff"/>
    <rect x="620" y="400" width="7" height="7" fill="#17d9ff"/>
    <rect x="153" y="397" width="7" height="7" fill="#ff2aa8"/>
  </g>

  <g filter="url(#shadow)">
    <ellipse cx="406" cy="547" rx="260" ry="62" fill="#020413" stroke="url(#edge)" stroke-width="5" filter="url(#glowBlue)"/>
    <ellipse cx="406" cy="530" rx="230" ry="48" fill="#080d24" stroke="#7e4cff" stroke-width="4" filter="url(#glowPink)"/>
    <ellipse cx="406" cy="516" rx="194" ry="35" fill="#05091c" stroke="#28cfff" stroke-width="3"/>
    <ellipse cx="406" cy="516" rx="150" ry="22" fill="none" stroke="#ff2aa8" stroke-opacity=".8" stroke-width="3"/>
  </g>

  <g transform="translate(206 78) rotate(-7 205 215)" filter="url(#shadow)">
    <path d="M54 30H326L372 76V390H54Z" fill="url(#paper)" stroke="url(#edge)" stroke-width="8"/>
    <path d="M326 30v46h46" fill="#111a3f" stroke="#df67ff" stroke-width="5"/>
    <text x="93" y="105" fill="#34b9ff" font-family="Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="5">BOLETO</text>
    <rect x="90" y="135" width="220" height="17" rx="3" fill="#2d8bff"/>
    <rect x="90" y="172" width="185" height="13" rx="3" fill="#7b55ff"/>
    <rect x="90" y="203" width="132" height="13" rx="3" fill="#a948ff"/>
    <rect x="90" y="238" width="230" height="10" rx="3" fill="#6a49d7"/>
    <rect x="90" y="265" width="170" height="10" rx="3" fill="#6a49d7"/>
    <g fill="#8f54ff">
      <rect x="90" y="310" width="8" height="56"/><rect x="104" y="310" width="5" height="56"/><rect x="116" y="310" width="10" height="56"/><rect x="132" y="310" width="4" height="56"/><rect x="143" y="310" width="8" height="56"/><rect x="158" y="310" width="4" height="56"/><rect x="169" y="310" width="11" height="56"/><rect x="187" y="310" width="6" height="56"/><rect x="199" y="310" width="4" height="56"/><rect x="210" y="310" width="10" height="56"/><rect x="227" y="310" width="5" height="56"/><rect x="239" y="310" width="9" height="56"/><rect x="254" y="310" width="4" height="56"/><rect x="265" y="310" width="11" height="56"/><rect x="283" y="310" width="5" height="56"/><rect x="295" y="310" width="8" height="56"/>
    </g>
    <rect x="292" y="260" width="48" height="40" rx="5" fill="#291451" stroke="#c252ff" stroke-width="3"/>
    <text x="302" y="287" fill="#c97aff" font-family="Arial, sans-serif" font-size="20" font-weight="800">R$</text>
  </g>

  <g transform="translate(408 335)" filter="url(#shadow)">
    <path d="M90 15c72 0 130 55 130 124 0 70-58 126-130 126-20 0-39-4-56-12l-45 16 14-44C-2 205-9 173-9 139-9 70 18 15 90 15Z" fill="url(#wa)" stroke="#7affc8" stroke-width="8" filter="url(#glowBlue)"/>
    <path d="M56 89c8-14 18-13 25-4l14 19c5 7 2 13-6 21-6 6-1 15 10 26 12 12 22 17 30 10 8-7 14-9 21-4l19 14c9 7 10 17-4 25-16 10-39 11-67-8-25-17-47-39-61-63-16-27-9-52 19-36Z" fill="none" stroke="#eafff7" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
