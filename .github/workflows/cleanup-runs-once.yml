name: Limpeza unica do historico do Actions

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/cleanup-runs-once.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    name: Manter somente os 10 runs mais recentes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Excluir runs antigos concluidos
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          KEEP: "10"
        run: |
          set -euo pipefail

          RUNS_FILE="$(mktemp)"
          PAGE=1

          while true; do
            RESPONSE="$(curl -fsS \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/actions/runs?per_page=100&page=${PAGE}")"

            COUNT="$(jq '.workflow_runs | length' <<<"${RESPONSE}")"
            if [[ "${COUNT}" -eq 0 ]]; then
              break
            fi

            jq -r '.workflow_runs[] | [.id, .status, .created_at, .name] | @tsv' <<<"${RESPONSE}" >> "${RUNS_FILE}"

            if [[ "${COUNT}" -lt 100 ]]; then
              break
            fi

            PAGE=$((PAGE + 1))
          done

          TOTAL="$(wc -l < "${RUNS_FILE}" | tr -d ' ')"
          echo "Runs encontrados: ${TOTAL}"
          echo "Runs mais recentes preservados: ${KEEP}"

          if [[ "${TOTAL}" -le "${KEEP}" ]]; then
            echo "Nada para excluir."
            exit 0
          fi

          DELETED=0
          SKIPPED=0
          FAILED=0

          while IFS=$'\t' read -r RUN_ID STATUS CREATED_AT RUN_NAME; do
            if [[ "${STATUS}" != "completed" ]]; then
              echo "Mantido por ainda estar ativo: ${RUN_ID} | ${RUN_NAME} | ${STATUS}"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            HTTP_CODE="$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/actions/runs/${RUN_ID}")"

            if [[ "${HTTP_CODE}" == "204" ]]; then
              echo "Excluido: ${RUN_ID} | ${CREATED_AT} | ${RUN_NAME}"
              DELETED=$((DELETED + 1))
            else
              echo "Falha ao excluir: ${RUN_ID} | HTTP ${HTTP_CODE} | ${RUN_NAME}"
              FAILED=$((FAILED + 1))
            fi
          done < <(tail -n +$((KEEP + 1)) "${RUNS_FILE}")

          echo "Resumo: excluidos=${DELETED}, ativos_preservados=${SKIPPED}, falhas=${FAILED}"

          if [[ "${FAILED}" -gt 0 ]]; then
            exit 1
          fi

      - name: Remover este workflow temporario
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          FILE_PATH=".github/workflows/cleanup-runs-once.yml"
          META="$(curl -fsS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/contents/${FILE_PATH}?ref=main")"

          FILE_SHA="$(jq -r '.sha' <<<"${META}")"
          PAYLOAD="$(jq -nc \
            --arg message "Remover workflow temporario de limpeza do Actions" \
            --arg sha "${FILE_SHA}" \
            --arg branch "main" \
            '{message: $message, sha: $sha, branch: $branch}')"

          curl -fsS -X DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/contents/${FILE_PATH}" \
            -d "${PAYLOAD}" > /dev/null

          echo "Workflow temporario removido do repositorio."
