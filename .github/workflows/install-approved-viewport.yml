name: Publicar viewport aprovada v9.2.1

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/install-approved-viewport.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  ASSET_PATH: assets/emissao-portal-wide-v9.2.1.avif
  EXPECTED_B64_LEN: "226400"
  EXPECTED_SIZE: "169800"
  EXPECTED_SHA256: fd39453584c7005dad4d13c17b5a02cb4caa302e1d3ded820ffd5a44f416e1de

jobs:
  install:
    name: Validar e publicar viewport steampunk
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reconstruir a arte aprovada como AVIF binario real
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/emissao-wide.b64
          blobs=(
            f7bed33784584bf2ba0753974f16a190dc03deb5
            3980463a570ac03232f32899865bc493db79dc01
            0e9ba01f46a4e1edd443be4effdcf80dbec7ea5e
            bf1666c25671f93b2cc73883732b16de8bef73a2
            60da9d564175cef82ade314af1950aac66d79a59
            067880c7cfc1196dffa96e2c06775d8e8d53f33a
            f078bcae8ebad1d919e4085db62a77140101763c
            84926197b096e318cace1b380db432c5230fda80
            801bfd94ec7ec91c3a77bb898722377626acf1f8
            8c132c9b79d1c1687a8f52105e8d3e2ada986ab1
            be31364b318ea232c3f224e65fc8511ae2d7ec06
            caddb48b7cb8ec210cc4cbb579158c593f6743d4
            151d9c137c7fa754397e9afea82aecc456a6fb63
            45e4df06c6656f1ce600e42191c843a5e081688c
            25187bceae533f58d044ab5081a18c8f9b87173c
            f804a866531882ff77fd0a2266c7370e5e84660e
          )

          for sha in "${blobs[@]}"; do
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" \
              | python3 -c 'import sys,json,base64; o=json.load(sys.stdin); sys.stdout.buffer.write(base64.b64decode(o["content"]))' \
              >> /tmp/emissao-wide.b64
          done

          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, os, struct

          text = b''.join(Path('/tmp/emissao-wide.b64').read_bytes().split())
          expected_b64 = int(os.environ['EXPECTED_B64_LEN'])
          assert len(text) == expected_b64, (len(text), expected_b64)

          binary = base64.b64decode(text, validate=True)
          expected_size = int(os.environ['EXPECTED_SIZE'])
          assert len(binary) == expected_size, (len(binary), expected_size)
          actual_sha = hashlib.sha256(binary).hexdigest()
          assert actual_sha == os.environ['EXPECTED_SHA256'], actual_sha
          assert binary[4:8] == b'ftyp', binary[:16]
          assert b'avif' in binary[:32], binary[:32]

          pos = binary.find(b'ispe')
          assert pos >= 0, 'ispe ausente'
          width, height = struct.unpack('>II', binary[pos+8:pos+16])
          assert (width, height) == (1916, 821), (width, height)

          Path('/tmp/emissao-approved.avif').write_bytes(binary)
          print('base64_decode=PASS')
          print('binary_size=PASS', len(binary))
          print('sha256=PASS', actual_sha)
          print('format=PASS AVIF')
          print('dimensions=PASS', width, height)
          PY

      - name: Preparar a integracao direta sem loader e sem fallback neon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          cp /tmp/emissao-approved.avif "$ASSET_PATH"
          cp emissao-v8.9.0.css emissao-v9.2.1.css

          python3 - <<'PY'
          from pathlib import Path
          p = Path('emissao-v9.2.1.css')
          text = p.read_text(encoding='utf-8')
          text = text.replace('v8.9.0 - Viewport wide definitivo', 'v9.2.1 - Viewport steampunk wide aprovada')
          p.write_text(text, encoding='utf-8')
          PY

          cat > emissao-v9.2.1.js <<'EOF'
          (() => {
            "use strict";
            const parcelSelect = document.querySelector("#parcel-mode-select");
            const emissionLogout = document.querySelector("#emissao-logout");
            const authLogout = document.querySelector("#auth-logout");
            const requestForm = document.querySelector("#request-form");

            if (parcelSelect) {
              parcelSelect.addEventListener("change", () => {
                const value = parcelSelect.value;
                if (!value) return;
                document.querySelector(`input[name="tipoSolicitacao"][value="${value}"]`)?.click();
              });
              document.querySelectorAll('input[name="tipoSolicitacao"]').forEach((radio) => {
                radio.addEventListener("change", () => {
                  if (radio.checked && parcelSelect.value !== radio.value) parcelSelect.value = radio.value;
                });
              });
              requestForm?.addEventListener("reset", () => {
                requestAnimationFrame(() => { parcelSelect.value = ""; });
              });
            }

            if (emissionLogout && authLogout) {
              emissionLogout.addEventListener("click", () => authLogout.click());
            }
          })();
          EOF

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          text = re.sub(r'emissao-v(?:8\.9\.0|9\.1\.0|9\.2\.0)\.css\?v=\d+', 'emissao-v9.2.1.css?v=1', text)
          text = re.sub(r'emissao-v(?:8\.9\.0|9\.1\.0|9\.2\.0)\.js\?v=\d+', 'emissao-v9.2.1.js?v=1', text)
          text = re.sub(
              r'(<img\s+class="desktop-mock"\s+src=")[^"]+("[^>]*>)',
              r'\1assets/emissao-portal-wide-v9.2.1.avif?v=1\2',
              text,
              count=1,
              flags=re.S,
          )
          text = re.sub(
              r'\s*<link rel="preload" href="assets/emissao-portal-wide-v9\.[^"]+" as="image"[^>]*>\n?',
              '\n',
              text,
          )
          anchor = '  <link rel="preload" href="assets/login-portal-full-v8.5.7.webp" as="image" type="image/webp">\n'
          preload = '  <link rel="preload" href="assets/emissao-portal-wide-v9.2.1.avif?v=1" as="image" type="image/avif" media="(min-width: 801px)">\n'
          assert anchor in text
          text = text.replace(anchor, anchor + preload, 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Validar integracao estatica
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path('index.html').read_text(encoding='utf-8')
          js = Path('emissao-v9.2.1.js').read_text(encoding='utf-8')
          css = Path('emissao-v9.2.1.css').read_text(encoding='utf-8')

          m = re.search(r'<img\s+class="desktop-mock"\s+src="([^"]+)"', html, re.S)
          assert m and m.group(1) == 'assets/emissao-portal-wide-v9.2.1.avif?v=1', m.group(1) if m else None
          assert 'emissao-v9.2.1.css?v=1' in html
          assert 'emissao-v9.2.1.js?v=1' in html
          assert 'emissao-v8.9.0.js?v=2' not in html
          assert 'WIDE_ART_SOURCE' not in js
          assert 'data:image/' not in js
          assert 'fetch(' not in js
          assert 'pixel-neon-whatsapp-desktop-colmeia-solar-v8.3.0.webp' not in m.group(0)
          assert '.visual-stage::before' in css and '.visual-stage::after' in css
          assert 'display: none !important' in css
          assert 'scaleX(-1)' not in js
          print('direct_binary_asset=PASS')
          print('no_base64_loader=PASS')
          print('no_neon_fallback=PASS')
          print('no_mirror_or_duplicate_js=PASS')
          PY

      - name: Validar geometria em seis viewports
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          ratio = 1916 / 821
          panel = (770, 80, 1148, 650)
          viewports = [
              (1366, 641, 'Chrome-1366x641'),
              (1366, 768, '1366x768'),
              (1440, 900, '1440x900'),
              (1600, 900, '1600x900'),
              (1920, 1080, 'FullHD'),
              (2560, 1080, 'Ultrawide'),
          ]
          for vw, vh, label in viewports:
              sw = max(vw, vh * ratio)
              sh = max(vh, vw / ratio)
              assert sw >= vw and sh >= vh
              scale = sw / 1916
              crop_x = max(0.0, (sw - vw) / 2 / scale)
              crop_y = max(0.0, (sh - vh) / 2 / scale)
              visible = (crop_x, crop_y, 1916 - crop_x, 821 - crop_y)
              assert panel[0] >= visible[0] and panel[2] <= visible[2], (label, visible)
              assert panel[1] >= visible[1] and panel[3] <= visible[3], (label, visible)
              print(f'{label}=PASS stage={sw:.1f}x{sh:.1f} crop_source={crop_x:.1f},{crop_y:.1f}')
          PY

      - name: Validar decodificacao no Chrome
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome" ]; then
            echo "Chrome/Chromium nao encontrado no runner; validacao binaria e geometrica ja passaram."
            exit 0
          fi
          mkdir -p /tmp/viewport-browser
          cp "$ASSET_PATH" /tmp/viewport-browser/emissao.avif
          cat > /tmp/viewport-browser/index.html <<'EOF'
          <!doctype html><html><head><meta charset="utf-8"><title>WAIT</title><style>
          html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#050402}
          .stage{position:fixed;left:50%;top:50%;width:max(100vw,calc(100vh * 2.3337393423));height:max(100vh,calc(100vw / 2.3337393423));transform:translate(-50%,-50%)}
          img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block}
          </style></head><body><div class="stage"><img src="emissao.avif" onload="document.title='IMAGE_OK'" onerror="document.title='IMAGE_FAIL'"></div></body></html>
          EOF
          out="$($chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=3000 --dump-dom --window-size=1366,641 file:///tmp/viewport-browser/index.html 2>/dev/null)"
          echo "$out" | grep -q '<title>IMAGE_OK</title>'
          echo "chrome_avif_decode=PASS"

      - name: Publicar somente depois de todos os testes passarem
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/install-approved-viewport.yml
          git rm -f .github/workflows/diagnose-viewport-chunks.yml || true
          git rm -f viewport-install-diagnostic.txt viewport-chunks-diagnostic.txt || true
          git add index.html emissao-v9.2.1.css emissao-v9.2.1.js "$ASSET_PATH"
          git status --short
          git commit -m "Publicar viewport steampunk aprovada v9.2.1"
          git push origin HEAD:main
