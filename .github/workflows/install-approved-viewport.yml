name: Publicar viewport aprovada v9.2

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/install-approved-viewport.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  ASSET_PATH: assets/emissao-portal-wide-v9.2.0.webp
  EXPECTED_B64_LEN: "226400"
  EXPECTED_AVIF_SIZE: "169800"
  EXPECTED_AVIF_SHA256: fd39453584c7005dad4d13c17b5a02cb4caa302e1d3ded820ffd5a44f416e1de
  EXPECTED_AHASH: "000000000007f0020c0fd8024ddfdf0203ff1f800bee188800ee1ed8089f1cc0608e1d8820fffb8818e7f30a180c188a40988c004098080008c0000000000000"

jobs:
  install:
    name: Testar e publicar viewport steampunk v9.2
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Garantir ferramentas de validacao
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffprobe >/dev/null 2>&1 || ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          ffprobe -version | head -1
          ffmpeg -version | head -1

      - name: Reconstruir exatamente a arte aprovada
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/emissao-wide.b64
          blobs=(
            f7bed33784584bf2ba0753974f16a190dc03deb5
            3980463a570ac03232f32899865bc493db79dc01
            0e9ba01f46a4e1edd443be4effdcf80dbec7ea5e
            bf1666c25671f93b2cc73883732b16de8bef73a2
            60da9d564175cef82ade314af1950aac66d79a59
            067880c7cfc1196dffa96e2c06775d8e8d53f33a
            f078bcae8ebad1d919e4085db62a77140101763c
            84926197b096e318cace1b380db432c5230fda80
            801bfd94ec7ec91c3a77bb898722377626acf1f8
            8c132c9b79d1c1687a8f52105e8d3e2ada986ab1
            be31364b318ea232c3f224e65fc8511ae2d7ec06
            caddb48b7cb8ec210cc4cbb579158c593f6743d4
            151d9c137c7fa754397e9afea82aecc456a6fb63
            45e4df06c6656f1ce600e42191c843a5e081688c
            25187bceae533f58d044ab5081a18c8f9b87173c
            f804a866531882ff77fd0a2266c7370e5e84660e
          )

          for sha in "${blobs[@]}"; do
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" \
              | python3 -c 'import sys,json,base64; o=json.load(sys.stdin); sys.stdout.buffer.write(base64.b64decode(o["content"]))' \
              >> /tmp/emissao-wide.b64
          done

          python3 - <<'PY'
          from pathlib import Path
          import base64, os
          src = Path('/tmp/emissao-wide.b64')
          text = b''.join(src.read_bytes().split())
          expected = int(os.environ['EXPECTED_B64_LEN'])
          assert len(text) == expected, (len(text), expected)
          binary = base64.b64decode(text, validate=True)
          Path('/tmp/emissao-wide-approved.avif').write_bytes(binary)
          print('base64=PASS chars=', len(text))
          print('decoded_bytes=', len(binary))
          PY

      - name: Validar a arte aprovada antes da conversao
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < /tmp/emissao-wide-approved.avif | tr -d ' ')" = "$EXPECTED_AVIF_SIZE"
          echo "${EXPECTED_AVIF_SHA256}  /tmp/emissao-wide-approved.avif" | sha256sum -c -
          file /tmp/emissao-wide-approved.avif | grep -q 'AVIF Image'
          dims="$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 /tmp/emissao-wide-approved.avif)"
          test "$dims" = "1916x821"
          echo "approved_binary_hash=PASS"
          echo "approved_format=PASS"
          echo "approved_dimensions=PASS ${dims}"

      - name: Validar fingerprint visual da arte aprovada
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -v error -i /tmp/emissao-wide-approved.avif -vf scale=32:16,format=gray -f rawvideo -pix_fmt gray /tmp/emissao-gray.raw -y
          python3 - <<'PY'
          from pathlib import Path
          import os
          b = Path('/tmp/emissao-gray.raw').read_bytes()
          assert len(b) == 512, len(b)
          mean = sum(b) / len(b)
          bits = ''.join('1' if x >= mean else '0' for x in b)
          actual = hex(int(bits, 2))[2:].zfill(128)
          expected = os.environ['EXPECTED_AHASH']
          assert actual == expected, (actual, expected)
          print('approved_visual_fingerprint=PASS', actual)
          PY

      - name: Converter para WebP lossless e provar equivalencia visual
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -v error -i /tmp/emissao-wide-approved.avif -frames:v 1 -c:v libwebp -lossless 1 -compression_level 6 -preset picture /tmp/emissao-wide.webp -y
          file /tmp/emissao-wide.webp | grep -q 'Web/P image'
          dims="$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 /tmp/emissao-wide.webp)"
          test "$dims" = "1916x821"

          ffmpeg -v error -i /tmp/emissao-wide-approved.avif -frames:v 1 -f rawvideo -pix_fmt rgb24 /tmp/approved.rgb -y
          ffmpeg -v error -i /tmp/emissao-wide.webp -frames:v 1 -f rawvideo -pix_fmt rgb24 /tmp/webp.rgb -y
          cmp -s /tmp/approved.rgb /tmp/webp.rgb

          echo "webp_format=PASS"
          echo "webp_dimensions=PASS ${dims}"
          echo "webp_pixel_equivalence=PASS"
          echo "webp_sha256=$(sha256sum /tmp/emissao-wide.webp | awk '{print $1}')"
          echo "webp_bytes=$(wc -c < /tmp/emissao-wide.webp | tr -d ' ')"

      - name: Preparar integracao limpa da emissao
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          cp /tmp/emissao-wide.webp "$ASSET_PATH"
          cp emissao-v8.9.0.css emissao-v9.2.0.css

          python3 - <<'PY'
          from pathlib import Path
          p = Path('emissao-v9.2.0.css')
          text = p.read_text(encoding='utf-8')
          text = text.replace('v8.9.0 - Viewport wide definitivo', 'v9.2.0 - Viewport steampunk wide aprovada')
          p.write_text(text, encoding='utf-8')
          PY

          cat > emissao-v9.2.0.js <<'EOF'
          (() => {
            "use strict";

            const parcelSelect = document.querySelector("#parcel-mode-select");
            const emissionLogout = document.querySelector("#emissao-logout");
            const authLogout = document.querySelector("#auth-logout");
            const requestForm = document.querySelector("#request-form");

            if (parcelSelect) {
              parcelSelect.addEventListener("change", () => {
                const value = parcelSelect.value;
                if (!value) return;
                document.querySelector(`input[name="tipoSolicitacao"][value="${value}"]`)?.click();
              });

              document.querySelectorAll('input[name="tipoSolicitacao"]').forEach((radio) => {
                radio.addEventListener("change", () => {
                  if (radio.checked && parcelSelect.value !== radio.value) {
                    parcelSelect.value = radio.value;
                  }
                });
              });

              requestForm?.addEventListener("reset", () => {
                requestAnimationFrame(() => { parcelSelect.value = ""; });
              });
            }

            if (emissionLogout && authLogout) {
              emissionLogout.addEventListener("click", () => authLogout.click());
            }
          })();
          EOF

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          text = re.sub(r'emissao-v(?:8\.9\.0|9\.1\.0)\.css\?v=\d+', 'emissao-v9.2.0.css?v=1', text)
          text = re.sub(r'emissao-v(?:8\.9\.0|9\.1\.0)\.js\?v=\d+', 'emissao-v9.2.0.js?v=1', text)
          text = re.sub(
              r'(<img\s+class="desktop-mock"\s+src=")[^"]+("[^>]*>)',
              r'\1assets/emissao-portal-wide-v9.2.0.webp?v=1\2',
              text,
              count=1,
              flags=re.S,
          )

          text = re.sub(
              r'\s*<link rel="preload" href="assets/emissao-portal-wide-v9\.[^"]+" as="image"[^>]*>\n?',
              '\n',
              text,
          )
          anchor = '  <link rel="preload" href="assets/login-portal-full-v8.5.7.webp" as="image" type="image/webp">\n'
          preload = '  <link rel="preload" href="assets/emissao-portal-wide-v9.2.0.webp?v=1" as="image" type="image/webp" media="(min-width: 801px)">\n'
          assert anchor in text
          text = text.replace(anchor, anchor + preload, 1)

          p.write_text(text, encoding='utf-8')
          PY

      - name: Testar integracao e eliminar causas anteriores
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path('index.html').read_text(encoding='utf-8')
          js = Path('emissao-v9.2.0.js').read_text(encoding='utf-8')
          css = Path('emissao-v9.2.0.css').read_text(encoding='utf-8')

          m = re.search(r'<img\s+class="desktop-mock"\s+src="([^"]+)"', html, re.S)
          assert m and m.group(1) == 'assets/emissao-portal-wide-v9.2.0.webp?v=1', m.group(1) if m else None
          assert 'emissao-v9.2.0.css?v=1' in html
          assert 'emissao-v9.2.0.js?v=1' in html
          assert 'emissao-v8.9.0.js?v=2' not in html
          assert 'WIDE_ART_SOURCE' not in js
          assert 'data:image/' not in js
          assert 'fetch(' not in js
          assert 'pixel-neon-whatsapp-desktop-colmeia-solar-v8.3.0.webp' not in m.group(0)
          assert '.visual-stage::before' in css and '.visual-stage::after' in css
          assert 'display: none !important' in css
          assert 'scaleX(-1)' not in js

          print('direct_webp_asset=PASS')
          print('no_base64_loader=PASS')
          print('no_neon_fallback=PASS')
          print('no_mirror_or_duplicate_js=PASS')
          PY

      - name: Testar geometria em seis tamanhos de desktop
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          ratio = 1916 / 821
          panel = (770, 80, 1148, 650)
          viewports = [
              (1366, 641, 'Chrome-1366x641'),
              (1366, 768, '1366x768'),
              (1440, 900, '1440x900'),
              (1600, 900, '1600x900'),
              (1920, 1080, 'FullHD'),
              (2560, 1080, 'Ultrawide'),
          ]
          for vw, vh, label in viewports:
              sw = max(vw, vh * ratio)
              sh = max(vh, vw / ratio)
              assert sw >= vw and sh >= vh
              scale = sw / 1916
              crop_x = max(0.0, (sw - vw) / 2 / scale)
              crop_y = max(0.0, (sh - vh) / 2 / scale)
              visible = (crop_x, crop_y, 1916 - crop_x, 821 - crop_y)
              assert panel[0] >= visible[0] and panel[2] <= visible[2], (label, visible)
              assert panel[1] >= visible[1] and panel[3] <= visible[3], (label, visible)
              print(f'{label}=PASS stage={sw:.1f}x{sh:.1f} crop_source={crop_x:.1f},{crop_y:.1f}')
          PY

      - name: Testar renderizacao real no Chrome
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium
            chrome="$(command -v chromium || command -v chromium-browser)"
          fi

          mkdir -p /tmp/viewport-browser
          cp "$ASSET_PATH" /tmp/viewport-browser/emissao.webp
          cat > /tmp/viewport-browser/index.html <<'EOF'
          <!doctype html>
          <html><head><meta charset="utf-8"><title>VIEWPORT_TEST</title><style>
          html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#050402}
          .stage{position:fixed;left:50%;top:50%;width:max(100vw,calc(100vh * 2.3337393423));height:max(100vh,calc(100vw / 2.3337393423));transform:translate(-50%,-50%)}
          img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block}
          input{position:absolute;left:44.95%;top:28%;width:14%;height:1.7%;border:0;background:transparent;transform:none;filter:none}
          </style></head><body><div class="stage" id="stage"><img src="emissao.webp"><input id="name"></div><script>
          const s=document.getElementById('stage');const i=document.getElementById('name');const a=s.getBoundingClientRect();i.focus();i.value='Teste Credvix';const b=s.getBoundingClientRect();const stable=Math.abs(a.x-b.x)<0.01&&Math.abs(a.y-b.y)<0.01&&Math.abs(a.width-b.width)<0.01&&Math.abs(a.height-b.height)<0.01;document.title=stable?'FOCUS_PASS':'FOCUS_FAIL';
          </script></body></html>
          EOF

          for size in 1366,641 1366,768 1600,900 1920,1080 2560,1080; do
            label="${size/,/x}"
            out="/tmp/viewport-browser/shot-${label}.png"
            "$chrome" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size="$size" --screenshot="$out" file:///tmp/viewport-browser/index.html >/tmp/chrome.log 2>&1
            test -s "$out"
            test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$out")" = "$label"
            bytes="$(wc -c < "$out" | tr -d ' ')"
            test "$bytes" -gt 100000
            "$chrome" --headless --no-sandbox --disable-gpu --dump-dom --window-size="$size" file:///tmp/viewport-browser/index.html 2>/dev/null | grep -q '<title>FOCUS_PASS</title>'
            echo "chrome_render_${label}=PASS bytes=${bytes}"
            echo "focus_stability_${label}=PASS"
          done

      - name: Substituir somente depois de todos os testes passarem
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm -f .github/workflows/install-approved-viewport.yml
          git rm -f .github/workflows/diagnose-viewport-chunks.yml || true
          git rm -f viewport-install-diagnostic.txt viewport-chunks-diagnostic.txt || true
          git add index.html emissao-v9.2.0.css emissao-v9.2.0.js "$ASSET_PATH"

          git status --short
          git commit -m "Publicar viewport steampunk aprovada v9.2"
          git push origin HEAD:main
