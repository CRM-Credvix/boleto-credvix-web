name: Inspecionar assets emissao v8.6.19

on:
  push:
    branches:
      - agent/emissao-arte-final-v8-6-19
    paths:
      - '.github/workflows/materialize-emissao-v8.6.19.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar branch
        uses: actions/checkout@v4
        with:
          ref: agent/emissao-arte-final-v8-6-19

      - name: Inspecionar PNGs existentes
        shell: bash
        run: |
          set -euo pipefail
          for f in assets/mock-aprovado.png assets/mock-exato.png; do
            echo "=== $f ==="
            file "$f"
            sha256sum "$f"
          done
          echo "SHA256 arte final esperada: 5668bef6a6d370597b643d5740b594ef2b1c603d95b5dbb05398643b7ca45ea5"
