name: Confirmar publicação v9.5.0

on:
  workflow_run:
    workflows: ["Publicar Boleto Credvix"]
    types: [completed]

permissions:
  contents: write

jobs:
  registrar:
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Registrar resultado
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ github.event.workflow_run.conclusion }}" = "success" ]; then
            file="PAGES_DEPLOYED_V9_5_0.txt"
            rm -f PAGES_FAILED_V9_5_0.txt
          else
            file="PAGES_FAILED_V9_5_0.txt"
            rm -f PAGES_DEPLOYED_V9_5_0.txt
          fi
          printf 'viewport=v9.5.0\nconclusion=%s\nrun_id=%s\nhead_sha=%s\n' \
            '${{ github.event.workflow_run.conclusion }}' \
            '${{ github.event.workflow_run.id }}' \
            '${{ github.event.workflow_run.head_sha }}' > "$file"
          git add PAGES_DEPLOYED_V9_5_0.txt PAGES_FAILED_V9_5_0.txt 2>/dev/null || true
          git add "$file"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "[skip ci] Registrar resultado do Pages v9.5.0"
          git push origin HEAD:main
