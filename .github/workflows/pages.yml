name: Validar e publicar Boleto Credvix

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    name: Validar viewport v11 e preparar site
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar Pillow
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Reconstruir viewport v11 aprovada
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64

          src = Path("assets/emissao-v11-src")
          parts = [
              src / "part-00.b64", src / "part-01.b64", src / "part-02.b64",
              src / "part-03.b64", src / "part-04.b64", src / "part-05.b64",
              src / "part-06.b64", src / "part-07a.b64", src / "part-07b.b64",
              src / "part-08.b64", src / "part-09.b64", src / "part-10.b64",
          ]
          missing = [str(p) for p in parts if not p.is_file()]
          if missing:
              raise SystemExit(f"Fragmentos ausentes: {missing}")

          payload = "".join(p.read_text(encoding="ascii").strip() for p in parts)
          payload += "=" * (-len(payload) % 4)
          raw = base64.b64decode(payload)
          out = Path("assets/emissao-viewport-v11-wide.webp")
          out.write_bytes(raw)
          print(f"VIEWPORT_BYTES={len(raw)}")
          PY

      - name: Validar viewport e arte de login
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageStat
          import hashlib

          checks = [
              (Path("assets/login-portal-full-v8.5.7.webp"), (1916, 821), "LOGIN"),
              (Path("assets/emissao-viewport-v11-wide.webp"), (2560, 1080), "VIEWPORT_V11"),
          ]

          for path, expected_size, label in checks:
              if not path.is_file():
                  raise SystemExit(f"{label}: arquivo ausente: {path}")
              raw = path.read_bytes()
              with Image.open(path) as image:
                  if image.format != "WEBP":
                      raise SystemExit(f"{label}: formato inesperado {image.format}")
                  if image.size != expected_size:
                      raise SystemExit(f"{label}: dimensoes {image.size}; esperado {expected_size}")
                  image.load()
                  gray = image.convert("L")
                  stat = ImageStat.Stat(gray)
                  if stat.mean[0] < 7 or stat.stddev[0] < 8:
                      raise SystemExit(f"{label}: imagem parece vazia ou preta")
              print(f"{label}_BYTES={len(raw)}")
              print(f"{label}_SHA256={hashlib.sha256(raw).hexdigest()}")
          PY

      - name: Garantir que o login nao mudou
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          if ! git diff --quiet refs/remotes/origin/main -- auth-v8.5.4.css auth-v8.4.0.js assets/login-portal-full-v8.5.7.webp; then
            echo "ERRO: arquivos do login foram alterados"
            git diff --stat refs/remotes/origin/main -- auth-v8.5.4.css auth-v8.4.0.js assets/login-portal-full-v8.5.7.webp
            exit 1
          fi

          python - <<'PY'
          import re, subprocess
          from pathlib import Path
          current = Path("index.html").read_text(encoding="utf-8")
          base = subprocess.check_output(["git", "show", "refs/remotes/origin/main:index.html"], text=True)
          pat = re.compile(r'<section id="auth-gate".*?</section>\s*<div id="auth-session-badge"', re.S)
          a, b = pat.search(current), pat.search(base)
          if not a or not b or a.group(0) != b.group(0):
              raise SystemExit("Estrutura HTML do login mudou")
          print("LOGIN_UNCHANGED=1")
          PY

      - name: Validar integracao v11
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'emissao-v11.0.0.css' index.html
          grep -q 'assets/emissao-viewport-v11-wide.webp' emissao-v11.0.0.css
          test -f emissao-v11.0.0.css
          test -f assets/emissao-viewport-v11-wide.webp

          node --check app.js
          node --check auth-v8.4.0.js
          node --check emissao-v8.6.12.js
          node --check emissao-v10.0.0.js

          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit
          from collections import Counter

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__(); self.ids=[]; self.refs=[]
              def handle_starttag(self, tag, attrs):
                  attrs=dict(attrs)
                  if "id" in attrs: self.ids.append(attrs["id"])
                  key="href" if tag=="link" else "src" if tag in {"script","img"} else None
                  if key and attrs.get(key): self.refs.append(attrs[key])

          html=Path("index.html").read_text(encoding="utf-8")
          p=Parser(); p.feed(html)
          dup=[k for k,v in Counter(p.ids).items() if v>1]
          if dup: raise SystemExit(f"IDs duplicados: {dup}")
          required={"auth-gate","auth-form","inicio","solicitar","request-form","solicitante","cpf","telefone","unidade","contrato","parcel-mode-select","consentimento","submit-button","emissao-logout","success-panel"}
          missing=sorted(required.difference(p.ids))
          if missing: raise SystemExit(f"IDs obrigatorios ausentes: {missing}")
          missing_files=[]
          for ref in p.refs:
              if ref.startswith(("http://","https://","//","data:","#")): continue
              path=urlsplit(ref).path
              if path and not Path(path).exists(): missing_files.append(path)
          if missing_files: raise SystemExit(f"Referencias locais ausentes: {sorted(set(missing_files))}")
          if "utm_source" in html: raise SystemExit("Parametro de rastreamento indevido no HTML")
          print("INTEGRACAO_V11_OK=1")
          PY

      - name: Criar preview de QA
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path("index.html").read_text(encoding="utf-8")
          html=re.sub(r'<script\b[^>]*>.*?</script>', '', html, flags=re.I|re.S)
          html=html.replace('<main id="inicio" class="visual-stage" hidden>', '<main id="inicio" class="visual-stage">')
          qa='''
          <style>#auth-gate{display:none!important}</style>
          <script>
          addEventListener('load',()=>{
            const ids=['solicitante','cpf','telefone','contrato','parcel-mode-select','consentimento','submit-button'];
            const failures=[];
            for(const id of ids){const el=document.getElementById(id);if(!el){failures.push('missing-'+id);continue;}const r=el.getBoundingClientRect();if(r.width<8||r.height<8)failures.push('collapsed-'+id);if(r.right<0||r.left>innerWidth||r.bottom<0||r.top>innerHeight)failures.push('offscreen-'+id);}
            document.documentElement.dataset.qa=failures.length?'fail-'+failures.join('-'):'ok';
          });
          </script>
          '''
          html=html.replace('</head>', qa+'</head>')
          Path("_qa-preview-v11.html").write_text(html,encoding="utf-8")
          PY

      - name: Testar v11 no Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          [ -n "$CHROME" ] || { echo "ERRO: Chrome/Chromium nao encontrado"; exit 1; }
          mkdir -p qa-v11
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/v11-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 2
          curl --fail --silent http://127.0.0.1:8765/assets/emissao-viewport-v11-wide.webp -o /dev/null
          curl --fail --silent http://127.0.0.1:8765/emissao-v11.0.0.css -o /dev/null

          check_layout() {
            local size="$1"
            local dump
            dump="$("$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size="$size" --dump-dom http://127.0.0.1:8765/_qa-preview-v11.html#solicitar 2>/dev/null)"
            grep -q 'data-qa="ok"' <<<"$dump" || { echo "ERRO: geometria invalida em $size"; grep -o 'data-qa="[^"]*"' <<<"$dump" || true; exit 1; }
          }

          check_layout 1365,695
          check_layout 1920,1080
          check_layout 2560,1080

          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1365,695 --screenshot=qa-v11/preview-1365x695.png http://127.0.0.1:8765/_qa-preview-v11.html#solicitar
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1920,1080 --screenshot=qa-v11/preview-1920x1080.png http://127.0.0.1:8765/_qa-preview-v11.html#solicitar
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=2560,1080 --screenshot=qa-v11/preview-2560x1080.png http://127.0.0.1:8765/_qa-preview-v11.html#solicitar
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --screenshot=qa-v11/preview-mobile-390x844.png http://127.0.0.1:8765/_qa-preview-v11.html#solicitar

          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageStat
          for path in Path("qa-v11").glob("*.png"):
              with Image.open(path) as im:
                  im.load(); stat=ImageStat.Stat(im.convert("L"))
                  if stat.mean[0] < 7 or stat.stddev[0] < 8:
                      raise SystemExit(f"Screenshot parece vazio/preto: {path}")
                  if im.width>=801:
                      edge=max(8,im.width//30)
                      for side,box in {"left":(0,0,edge,im.height),"right":(im.width-edge,0,im.width,im.height)}.items():
                          crop=im.convert("L").crop(box); vals=list(crop.getdata()); near=sum(v<=3 for v in vals)/len(vals)
                          if near>.985 and ImageStat.Stat(crop).stddev[0]<3:
                              raise SystemExit(f"Faixa preta detectada: {path.name}/{side}")
                  print(path.name,"OK")
          PY

      - name: Guardar screenshots de QA
        uses: actions/upload-artifact@v4
        with:
          name: qa-viewport-v11-${{ github.sha }}
          path: qa-v11/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Preparar pacote limpo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            --exclude '_qa-preview-v11.html' \
            --exclude 'qa-v11' \
            --exclude '*.b64' \
            --exclude 'assets/emissao-v11-src' \
            ./ _site/
          test -f _site/assets/emissao-viewport-v11-wide.webp
          test -f _site/emissao-v11.0.0.css
          test -f _site/assets/login-portal-full-v8.5.7.webp
          if find _site -type f -name '*.b64' -print -quit | grep -q .; then
            echo "ERRO: fragmentos b64 vazaram para o pacote"
            exit 1
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empacotar site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

  deploy:
    name: Publicar site
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write
      actions: read

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
