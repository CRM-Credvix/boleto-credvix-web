name: Publicar Boleto Credvix

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  VIEWPORT_ASSET: assets/emissao-portal-wide-v9.4.0.avif

jobs:
  build:
    name: Preparar e validar site
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Montar viewport steampunk v9.4.0
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, os, struct

          parts = [Path(f"assets/viewport-v9.4.0/part-{i:02d}.b64") for i in range(7)]
          missing = [str(p) for p in parts if not p.is_file()]
          assert not missing, f"Partes ausentes: {missing}"

          encoded = "".join("".join(p.read_text(encoding="utf-8").split()) for p in parts)
          raw = base64.b64decode(encoded, validate=True)
          out = Path(os.environ["VIEWPORT_ASSET"])
          out.write_bytes(raw)

          assert raw[4:8] == b"ftyp" and b"avif" in raw[:32], "AVIF invalido"
          pos = raw.find(b"ispe")
          assert pos >= 0, "Caixa ispe ausente"
          width, height = struct.unpack(">II", raw[pos+8:pos+16])
          assert (width, height) == (1916, 821), (width, height)

          print(f"viewport_size={len(raw)}")
          print(f"viewport_sha256={hashlib.sha256(raw).hexdigest()}")
          print(f"viewport_dimensions={width}x{height}")
          print("viewport_binary=PASS")
          PY

      - name: Validar integracao da emissao
        shell: bash
        run: |
          set -euo pipefail
          node --check emissao-v9.4.0.js
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path("index.html").read_text(encoding="utf-8")
          js = Path("emissao-v9.4.0.js").read_text(encoding="utf-8")

          match = re.search(r'<img\s+class="desktop-mock"\s+src="([^"]+)"', html, re.S)
          assert match, "desktop-mock ausente"
          assert match.group(1) == "assets/emissao-portal-wide-v9.4.0.avif?v=1"
          assert "emissao-v9.4.0.js?v=1" in html
          assert "emissao-v8.9.0.js?v=2" not in html
          assert "WIDE_ART_SOURCE" not in js
          assert "data:image/" not in js
          assert "fetch(" not in js
          assert "pixel-neon-whatsapp-desktop-colmeia-solar-v8.3.0.webp" not in match.group(0)

          ratio = 1916 / 821
          panel = (770, 80, 1148, 650)
          for vw, vh in [(1366,641),(1366,768),(1440,900),(1600,900),(1920,1080),(2560,1080)]:
              sw = max(vw, vh * ratio)
              sh = max(vh, vw / ratio)
              scale = sw / 1916
              crop_x = max(0.0, (sw-vw)/2/scale)
              crop_y = max(0.0, (sh-vh)/2/scale)
              visible = (crop_x, crop_y, 1916-crop_x, 821-crop_y)
              assert panel[0] >= visible[0] and panel[2] <= visible[2]
              assert panel[1] >= visible[1] and panel[3] <= visible[3]

          print("integration=PASS")
          print("no_runtime_base64=PASS")
          print("no_neon_fallback=PASS")
          print("geometry_6_viewports=PASS")
          PY

      - name: Limpar fragmentos de build
        shell: bash
        run: |
          rm -rf assets/viewport-v9.4.0

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empacotar site validado
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

  deploy:
    name: Publicar site
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
