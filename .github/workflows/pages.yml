name: Publicar Boleto Credvix

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: https://crm-credvix.github.io/boleto-credvix-web/

    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v6

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar arquivos do site
        id: artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Publicar e aguardar GitHub Pages
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
        run: |
          set -euo pipefail

          OIDC_TOKEN="$(curl -fsS \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}" | jq -r '.value')"

          PAYLOAD="$(jq -nc \
            --argjson artifact_id "${ARTIFACT_ID}" \
            --arg pages_build_version "${GITHUB_SHA}" \
            --arg oidc_token "${OIDC_TOKEN}" \
            '{artifact_id: $artifact_id, pages_build_version: $pages_build_version, oidc_token: $oidc_token}')"

          RESPONSE="$(curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/deployments" \
            -d "${PAYLOAD}")"

          STATUS_URL="$(jq -r '.status_url' <<<"${RESPONSE}")"
          PAGE_URL="$(jq -r '.page_url // empty' <<<"${RESPONSE}")"

          if [[ -z "${STATUS_URL}" || "${STATUS_URL}" == "null" ]]; then
            echo "A API do Pages nao retornou a URL de acompanhamento."
            exit 1
          fi

          for attempt in $(seq 1 180); do
            STATUS="$(curl -fsS \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${STATUS_URL}" | jq -r '.status')"

            echo "Status do Pages: ${STATUS} (consulta ${attempt}/180)"

            case "${STATUS}" in
              succeed)
                echo "GitHub Pages publicado com sucesso: ${PAGE_URL}"
                exit 0
                ;;
              deployment_failed|deployment_perms_error|deployment_content_failed|deployment_cancelled|deployment_lost)
                echo "Falha definitiva do GitHub Pages: ${STATUS}"
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "O Pages continuou na fila por 30 minutos. O deploy nao foi cancelado."
          exit 1
