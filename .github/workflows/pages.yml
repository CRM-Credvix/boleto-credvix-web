name: Publicar Boleto Credvix

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  VIEWPORT_ASSET: assets/emissao-portal-wide-v9.2.2.avif
  EXPECTED_B64_LEN: "226400"
  EXPECTED_SIZE: "169800"
  EXPECTED_SHA256: fd39453584c7005dad4d13c17b5a02cb4caa302e1d3ded820ffd5a44f416e1de

jobs:
  build:
    name: Preparar e validar site
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruir viewport aprovada como binario real
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/emissao-wide.b64
          blobs=(
            f7bed33784584bf2ba0753974f16a190dc03deb5
            3980463a570ac03232f32899865bc493db79dc01
            0e9ba01f46a4e1edd443be4effdcf80dbec7ea5e
            bf1666c25671f93b2cc73883732b16de8bef73a2
            60da9d564175cef82ade314af1950aac66d79a59
            067880c7cfc1196dffa96e2c06775d8e8d53f33a
            f078bcae8ebad1d919e4085db62a77140101763c
            84926197b096e318cace1b380db432c5230fda80
            801bfd94ec7ec91c3a77bb898722377626acf1f8
            8c132c9b79d1c1687a8f52105e8d3e2ada986ab1
            be31364b318ea232c3f224e65fc8511ae2d7ec06
            caddb48b7cb8ec210cc4cbb579158c593f6743d4
            151d9c137c7fa754397e9afea82aecc456a6fb63
            45e4df06c6656f1ce600e42191c843a5e081688c
            25187bceae533f58d044ab5081a18c8f9b87173c
            f804a866531882ff77fd0a2266c7370e5e84660e
          )

          for sha in "${blobs[@]}"; do
            if git cat-file -e "${sha}^{blob}" 2>/dev/null; then
              git cat-file blob "$sha" >> /tmp/emissao-wide.b64
            else
              curl -fsSL \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" \
                | python3 -c 'import sys,json,base64; o=json.load(sys.stdin); sys.stdout.buffer.write(base64.b64decode(o["content"]))' \
                >> /tmp/emissao-wide.b64
            fi
          done

          mkdir -p assets
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, os, struct

          text = b''.join(Path('/tmp/emissao-wide.b64').read_bytes().split())
          assert len(text) == int(os.environ['EXPECTED_B64_LEN']), len(text)
          binary = base64.b64decode(text, validate=True)
          assert len(binary) == int(os.environ['EXPECTED_SIZE']), len(binary)
          sha = hashlib.sha256(binary).hexdigest()
          assert sha == os.environ['EXPECTED_SHA256'], sha
          assert binary[4:8] == b'ftyp' and b'avif' in binary[:32]
          pos = binary.find(b'ispe')
          assert pos >= 0, 'ispe ausente'
          width, height = struct.unpack('>II', binary[pos+8:pos+16])
          assert (width, height) == (1916, 821), (width, height)
          Path(os.environ['VIEWPORT_ASSET']).write_bytes(binary)
          print('viewport_binary=PASS')
          print('sha256=PASS', sha)
          print('dimensions=PASS', width, height)
          PY

      - name: Montar emissao limpa v9.2.2
        shell: bash
        run: |
          set -euo pipefail
          cp emissao-v8.9.0.css emissao-v9.2.2.css
          sed -i 's/v8.9.0 - Viewport wide definitivo/v9.2.2 - Viewport steampunk wide aprovada/' emissao-v9.2.2.css

          cat > emissao-v9.2.2.js <<'EOF'
          (() => {
            "use strict";
            const parcelSelect = document.querySelector("#parcel-mode-select");
            const emissionLogout = document.querySelector("#emissao-logout");
            const authLogout = document.querySelector("#auth-logout");
            const requestForm = document.querySelector("#request-form");

            if (parcelSelect) {
              parcelSelect.addEventListener("change", () => {
                if (!parcelSelect.value) return;
                document.querySelector(`input[name="tipoSolicitacao"][value="${parcelSelect.value}"]`)?.click();
              });
              document.querySelectorAll('input[name="tipoSolicitacao"]').forEach((radio) => {
                radio.addEventListener("change", () => {
                  if (radio.checked) parcelSelect.value = radio.value;
                });
              });
              requestForm?.addEventListener("reset", () => {
                requestAnimationFrame(() => { parcelSelect.value = ""; });
              });
            }

            if (emissionLogout && authLogout) {
              emissionLogout.addEventListener("click", () => authLogout.click());
            }
          })();
          EOF

          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          text = re.sub(r'emissao-v(?:8\.9\.0|9\.1\.0|9\.2\.0|9\.2\.1|9\.2\.2)\.css\?v=\d+', 'emissao-v9.2.2.css?v=1', text)
          text = re.sub(r'emissao-v(?:8\.9\.0|9\.1\.0|9\.2\.0|9\.2\.1|9\.2\.2)\.js\?v=\d+', 'emissao-v9.2.2.js?v=1', text)
          text = re.sub(
              r'(<img\s+class="desktop-mock"\s+src=")[^"]+("[^>]*>)',
              r'\1assets/emissao-portal-wide-v9.2.2.avif?v=1\2',
              text,
              count=1,
              flags=re.S,
          )
          text = re.sub(
              r'\s*<link rel="preload" href="assets/emissao-portal-wide-v9\.[^"]+" as="image"[^>]*>\n?',
              '\n',
              text,
          )
          anchor = '  <link rel="preload" href="assets/login-portal-full-v8.5.7.webp" as="image" type="image/webp">\n'
          preload = '  <link rel="preload" href="assets/emissao-portal-wide-v9.2.2.avif?v=1" as="image" type="image/avif" media="(min-width: 801px)">\n'
          assert anchor in text
          text = text.replace(anchor, anchor + preload, 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Executar testes finais
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path('index.html').read_text(encoding='utf-8')
          js = Path('emissao-v9.2.2.js').read_text(encoding='utf-8')
          css = Path('emissao-v9.2.2.css').read_text(encoding='utf-8')
          asset = Path('assets/emissao-portal-wide-v9.2.2.avif')

          assert asset.exists() and asset.stat().st_size == 169800
          m = re.search(r'<img\s+class="desktop-mock"\s+src="([^"]+)"', html, re.S)
          assert m and m.group(1) == 'assets/emissao-portal-wide-v9.2.2.avif?v=1'
          assert 'emissao-v9.2.2.css?v=1' in html
          assert 'emissao-v9.2.2.js?v=1' in html
          assert 'fetch(' not in js and 'data:image/' not in js and 'WIDE_ART_SOURCE' not in js
          assert 'pixel-neon-whatsapp-desktop-colmeia-solar-v8.3.0.webp' not in m.group(0)
          assert '.visual-stage::before' in css and 'display: none !important' in css

          ratio = 1916 / 821
          panel = (770, 80, 1148, 650)
          for vw, vh in [(1366,641),(1366,768),(1440,900),(1600,900),(1920,1080),(2560,1080)]:
              sw = max(vw, vh * ratio)
              sh = max(vh, vw / ratio)
              assert sw >= vw and sh >= vh
              scale = sw / 1916
              cx = max(0.0, (sw-vw)/2/scale)
              cy = max(0.0, (sh-vh)/2/scale)
              visible = (cx, cy, 1916-cx, 821-cy)
              assert panel[0] >= visible[0] and panel[2] <= visible[2]
              assert panel[1] >= visible[1] and panel[3] <= visible[3]

          print('direct_binary_asset=PASS')
          print('no_runtime_base64=PASS')
          print('no_neon_fallback=PASS')
          print('geometry_6_viewports=PASS')
          PY

          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$chrome" ]; then
            mkdir -p /tmp/chrome-viewport
            cp "$VIEWPORT_ASSET" /tmp/chrome-viewport/emissao.avif
            cat > /tmp/chrome-viewport/index.html <<'EOF'
            <!doctype html><html><head><meta charset="utf-8"><title>WAIT</title></head><body style="margin:0;background:#050402"><img src="emissao.avif" style="width:100vw;height:100vh;object-fit:cover" onload="document.title='IMAGE_OK'" onerror="document.title='IMAGE_FAIL'"></body></html>
            EOF
            "$chrome" --headless --no-sandbox --disable-gpu --virtual-time-budget=3000 --dump-dom --window-size=1366,641 file:///tmp/chrome-viewport/index.html 2>/dev/null | grep -q '<title>IMAGE_OK</title>'
            echo "chrome_decode=PASS"
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empacotar site validado
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

  deploy:
    name: Publicar site
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write
      actions: read

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
