name: Validar e publicar Boleto Credvix

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    name: Validar viewport v12 e preparar site
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar Pillow
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Reconstruir viewport v12 aprovada
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib

          src = Path("assets/emissao-v12-src")
          parts = [src / f"part-{i:02d}.b64" for i in range(10)]
          missing = [str(p) for p in parts if not p.is_file()]
          if missing:
              raise SystemExit(f"Fragmentos v12 ausentes: {missing}")

          payload = "".join(p.read_text(encoding="ascii").strip() for p in parts)
          payload += "=" * (-len(payload) % 4)
          raw = base64.b64decode(payload, validate=True)

          expected_bytes = 147480
          expected_sha = "e5ffc8b5d605ba4c3318dfdac2f8f135ca526098e9b77318b3cf7901a1ed9d41"
          actual_sha = hashlib.sha256(raw).hexdigest()
          if len(raw) != expected_bytes:
              raise SystemExit(f"VIEWPORT_V12: tamanho {len(raw)}; esperado {expected_bytes}")
          if actual_sha != expected_sha:
              raise SystemExit(f"VIEWPORT_V12: SHA256 {actual_sha}; esperado {expected_sha}")

          out = Path("assets/emissao-viewport-v12-wide.webp")
          out.write_bytes(raw)
          print(f"VIEWPORT_V12_BYTES={len(raw)}")
          print(f"VIEWPORT_V12_SHA256={actual_sha}")
          PY

      - name: Validar viewport v12 e arte de login
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageStat
          import hashlib

          checks = [
              (Path("assets/login-portal-full-v8.5.7.webp"), (1916, 821), "LOGIN"),
              (Path("assets/emissao-viewport-v12-wide.webp"), (1916, 821), "VIEWPORT_V12"),
          ]
          for path, expected_size, label in checks:
              if not path.is_file():
                  raise SystemExit(f"{label}: arquivo ausente: {path}")
              raw = path.read_bytes()
              with Image.open(path) as image:
                  if image.format != "WEBP":
                      raise SystemExit(f"{label}: formato inesperado {image.format}")
                  if image.size != expected_size:
                      raise SystemExit(f"{label}: dimensoes {image.size}; esperado {expected_size}")
                  image.load()
                  stat = ImageStat.Stat(image.convert("L"))
                  if stat.mean[0] < 7 or stat.stddev[0] < 8:
                      raise SystemExit(f"{label}: imagem parece vazia ou preta")
              print(f"{label}_BYTES={len(raw)}")
              print(f"{label}_SHA256={hashlib.sha256(raw).hexdigest()}")
          PY

      - name: Garantir que o login nao mudou
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          if ! git diff --quiet refs/remotes/origin/main -- auth-v8.5.4.css auth-v8.4.0.js assets/login-portal-full-v8.5.7.webp; then
            echo "ERRO: arquivos do login foram alterados"
            git diff --stat refs/remotes/origin/main -- auth-v8.5.4.css auth-v8.4.0.js assets/login-portal-full-v8.5.7.webp
            exit 1
          fi
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path
          current = Path("index.html").read_text(encoding="utf-8")
          base = subprocess.check_output(["git", "show", "refs/remotes/origin/main:index.html"], text=True)
          pat = re.compile(r'<section id="auth-gate".*?</section>\s*<div id="auth-session-badge"', re.S)
          a, b = pat.search(current), pat.search(base)
          if not a or not b or a.group(0) != b.group(0):
              raise SystemExit("Estrutura HTML do login mudou")
          print("LOGIN_UNCHANGED=1")
          PY

      - name: Validar integracao v12
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'emissao-v12.0.0.css' index.html
          grep -q 'assets/emissao-viewport-v12-wide.webp' index.html
          grep -q 'assets/emissao-viewport-v12-wide.webp' emissao-v12.0.0.css
          test -f emissao-v12.0.0.css
          test -f assets/emissao-viewport-v12-wide.webp
          node --check app.js
          node --check auth-v8.4.0.js
          node --check emissao-v8.6.12.js
          node --check emissao-v10.0.0.js
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit
          from collections import Counter

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__(); self.ids=[]; self.refs=[]
              def handle_starttag(self, tag, attrs):
                  attrs=dict(attrs)
                  if "id" in attrs: self.ids.append(attrs["id"])
                  key="href" if tag=="link" else "src" if tag in {"script","img"} else None
                  if key and attrs.get(key): self.refs.append(attrs[key])

          html=Path("index.html").read_text(encoding="utf-8")
          p=Parser(); p.feed(html)
          dup=[k for k,v in Counter(p.ids).items() if v>1]
          if dup: raise SystemExit(f"IDs duplicados: {dup}")
          required={"auth-gate","auth-form","inicio","solicitar","request-form","solicitante","cpf","telefone","unidade","contrato","parcel-mode-select","consentimento","submit-button","emissao-logout","success-panel"}
          missing=sorted(required.difference(p.ids))
          if missing: raise SystemExit(f"IDs obrigatorios ausentes: {missing}")
          missing_files=[]
          for ref in p.refs:
              if ref.startswith(("http://","https://","//","data:","#")): continue
              path=urlsplit(ref).path
              if path and not Path(path).exists(): missing_files.append(path)
          if missing_files: raise SystemExit(f"Referencias locais ausentes: {sorted(set(missing_files))}")
          if "utm_source" in html: raise SystemExit("Parametro de rastreamento indevido no HTML")
          print("INTEGRACAO_V12_OK=1")
          PY

      - name: Criar preview de QA v12
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path("index.html").read_text(encoding="utf-8")
          html=re.sub(r'<script\b[^>]*>.*?</script>', '', html, flags=re.I|re.S)
          html=html.replace('<main id="inicio" class="visual-stage" hidden>', '<main id="inicio" class="visual-stage">')
          qa='''
          <style>#auth-gate{display:none!important}</style>
          <script>
          addEventListener('load',()=>{
            const ids=['solicitante','cpf','telefone','contrato','parcel-mode-select','consentimento','submit-button'];
            const failures=[];
            for(const id of ids){
              const el=document.getElementById(id);
              if(!el){failures.push('missing-'+id);continue;}
              const r=el.getBoundingClientRect();
              if(r.width<8||r.height<8)failures.push('collapsed-'+id);
              if(r.right<0||r.left>innerWidth||r.bottom<0||r.top>innerHeight)failures.push('offscreen-'+id);
            }
            document.documentElement.dataset.qa=failures.length?'fail-'+failures.join('-'):'ok';
          });
          </script>
          '''
          html=html.replace('</head>', qa+'</head>')
          Path("_qa-preview-v12.html").write_text(html,encoding="utf-8")
          PY

      - name: Testar v12 no Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          [ -n "$CHROME" ] || { echo "ERRO: Chrome/Chromium nao encontrado"; exit 1; }
          mkdir -p qa-v12
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/v12-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 2
          curl --fail --silent http://127.0.0.1:8765/assets/emissao-viewport-v12-wide.webp -o /dev/null
          curl --fail --silent http://127.0.0.1:8765/emissao-v12.0.0.css -o /dev/null

          check_layout() {
            local size="$1"
            local dump
            dump="$("$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size="$size" --dump-dom http://127.0.0.1:8765/_qa-preview-v12.html#solicitar 2>/dev/null)"
            grep -q 'data-qa="ok"' <<<"$dump" || { echo "ERRO: geometria invalida em $size"; grep -o 'data-qa="[^"]*"' <<<"$dump" || true; exit 1; }
          }

          check_layout 1365,695
          check_layout 1920,1080
          check_layout 2560,1080

          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1365,695 --screenshot=qa-v12/preview-1365x695.png http://127.0.0.1:8765/_qa-preview-v12.html#solicitar
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1920,1080 --screenshot=qa-v12/preview-1920x1080.png http://127.0.0.1:8765/_qa-preview-v12.html#solicitar
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=2560,1080 --screenshot=qa-v12/preview-2560x1080.png http://127.0.0.1:8765/_qa-preview-v12.html#solicitar

      - name: Guardar screenshots de QA
        uses: actions/upload-artifact@v4
        with:
          name: qa-v12
          path: qa-v12

      - name: Preparar pacote limpo
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _qa-preview-v12.html qa-v12
          rm -rf assets/emissao-v11-src assets/emissao-v12-src

      - name: Configurar GitHub Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@v5

      - name: Empacotar site
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    if: github.event_name == 'push'
    needs: build
    name: Publicar site
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  cleanup:
    if: github.event_name == 'push' && always() && needs.deploy.result == 'success'
    needs: deploy
    name: Limpar historico antigo do Actions
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Manter somente o workflow run atual
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          current_id = int(os.environ["GITHUB_RUN_ID"])
          token = os.environ["GH_TOKEN"]
          api = "https://api.github.com"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "credvix-actions-cleanup",
          }

          def get_json(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          current = get_json(f"{api}/repos/{repo}/actions/runs/{current_id}")
          cutoff = current["created_at"]
          runs=[]
          page=1
          while True:
              data=get_json(f"{api}/repos/{repo}/actions/runs?per_page=100&page={page}")
              batch=data.get("workflow_runs", [])
              if not batch: break
              runs.extend(batch)
              if len(batch)<100: break
              page+=1
          targets=[run for run in runs if int(run["id"])!=current_id and run.get("created_at", "")<=cutoff]
          deleted=0
          for run in targets:
              run_id=int(run["id"])
              req=urllib.request.Request(f"{api}/repos/{repo}/actions/runs/{run_id}",headers=headers,method="DELETE")
              try:
                  with urllib.request.urlopen(req, timeout=30): pass
                  deleted+=1
              except urllib.error.HTTPError as exc:
                  if exc.code==404: continue
                  raise
          remaining=get_json(f"{api}/repos/{repo}/actions/runs?per_page=100").get("workflow_runs", [])
          stale=[run for run in remaining if int(run["id"])!=current_id and run.get("created_at", "")<=cutoff]
          if stale:
              raise SystemExit(f"Runs antigos ainda presentes: {[run['id'] for run in stale]}")
          print(f"WORKFLOW_RUNS_REMOVIDOS={deleted}")
          print(f"WORKFLOW_RUN_MANTIDO={current_id}")
          PY
