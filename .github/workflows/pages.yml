name: Validar e publicar Boleto Credvix

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    name: Validar viewport e preparar site
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configurar Python de validacao
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar validador de imagem
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Validar arte-base do login reutilizada na emissao
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageStat
          import hashlib

          path = Path("assets/login-portal-full-v8.5.7.webp")
          if not path.is_file():
              raise SystemExit("Arte-base do login nao encontrada")

          payload = path.read_bytes()
          with Image.open(path) as image:
              if image.format != "WEBP":
                  raise SystemExit(f"Formato inesperado: {image.format}")
              if image.size != (1916, 821):
                  raise SystemExit(f"Dimensoes inesperadas: {image.size}; esperado (1916, 821)")
              image.load()
              gray = image.convert("L")
              stat = ImageStat.Stat(gray)
              if stat.mean[0] < 7 or stat.stddev[0] < 8:
                  raise SystemExit("Arte-base parece vazia ou preta")

          print(f"LOGIN_ART_BYTES={len(payload)}")
          print(f"LOGIN_ART_SHA256={hashlib.sha256(payload).hexdigest()}")
          print("LOGIN_ART_OK=1")
          PY

      - name: Garantir que a tela de login nao foi alterada
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main

          if ! git diff --quiet refs/remotes/origin/main -- auth-v8.5.4.css auth-v8.4.0.js assets/login-portal-full-v8.5.7.webp; then
            echo "ERRO: arquivos da tela de login foram modificados neste PR"
            git diff --stat refs/remotes/origin/main -- auth-v8.5.4.css auth-v8.4.0.js assets/login-portal-full-v8.5.7.webp
            exit 1
          fi

          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          current = Path("index.html").read_text(encoding="utf-8")
          base = subprocess.check_output(
              ["git", "show", "refs/remotes/origin/main:index.html"], text=True
          )

          pattern = re.compile(r'<section id="auth-gate".*?</section>\s*<div id="auth-session-badge"', re.S)
          current_match = pattern.search(current)
          base_match = pattern.search(base)
          if not current_match or not base_match:
              raise SystemExit("Nao foi possivel isolar a estrutura do login")
          if current_match.group(0) != base_match.group(0):
              raise SystemExit("A estrutura HTML do login mudou")
          print("LOGIN_MARKUP_UNCHANGED=1")
          PY

      - name: Validar HTML, CSS, referencias e JavaScript
        shell: bash
        run: |
          set -euo pipefail

          grep -q 'emissao-v10.0.0.css?v=2' index.html
          grep -q 'emissao-v10.0.0.js?v=2' index.html
          grep -q 'url("assets/login-portal-full-v8.5.7.webp")' emissao-v10.0.0.css

          if grep -Eq 'emissao-portal-wide-v10|emissao-v10\.0\.0/(part|chunk)|fetch\(.+emissao-v10' index.html emissao-v10.0.0.css emissao-v10.0.0.js; then
            echo "ERRO: a emissao ainda depende de asset experimental ou montagem no navegador"
            exit 1
          fi

          if grep -Eq 'emissao-v8\.6\.7\.(css|js)|emissao-v8\.7\.0\.(css|js)' index.html; then
            echo "ERRO: index ainda carrega patches antigos conflitantes da emissao"
            exit 1
          fi

          node --check app.js
          node --check auth-v8.4.0.js
          node --check emissao-v8.6.12.js
          node --check emissao-v10.0.0.js

          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit
          from collections import Counter

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
                  self.refs = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if "id" in attrs:
                      self.ids.append(attrs["id"])
                  key = "href" if tag == "link" else "src" if tag in {"script", "img"} else None
                  if key and attrs.get(key):
                      self.refs.append(attrs[key])

          html = Path("index.html").read_text(encoding="utf-8")
          parser = Parser()
          parser.feed(html)

          duplicated = [name for name, count in Counter(parser.ids).items() if count > 1]
          if duplicated:
              raise SystemExit(f"IDs HTML duplicados: {duplicated}")

          required = {
              "auth-gate", "auth-form", "auth-email", "auth-password", "auth-submit",
              "inicio", "solicitar", "request-form", "solicitante", "cpf", "telefone",
              "unidade", "contrato", "parcel-mode-select", "consentimento", "submit-button",
              "emissao-logout", "success-panel"
          }
          missing = sorted(required.difference(parser.ids))
          if missing:
              raise SystemExit(f"IDs obrigatorios ausentes: {missing}")

          missing_files = []
          for ref in parser.refs:
              if ref.startswith(("http://", "https://", "//", "data:", "#")):
                  continue
              path = urlsplit(ref).path
              if path and not Path(path).exists():
                  missing_files.append(path)
          if missing_files:
              raise SystemExit(f"Referencias locais inexistentes: {sorted(set(missing_files))}")

          if "utm_source" in html:
              raise SystemExit("Parametro de rastreamento indevido encontrado no HTML")

          css = Path("emissao-v10.0.0.css").read_text(encoding="utf-8")
          required_css = [
              "background-size: cover, cover",
              ".form-layer",
              ".emissao-logout",
              "@media (min-width: 801px)",
          ]
          for token in required_css:
              if token not in css:
                  raise SystemExit(f"Regra CSS obrigatoria ausente: {token}")

          print("HTML_CSS_JS_OK=1")
          PY

      - name: Criar preview de QA sem autenticar
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          html = Path("index.html").read_text(encoding="utf-8")
          html = re.sub(r'<script\b[^>]*>.*?</script>', '', html, flags=re.I | re.S)
          html = html.replace('<main id="inicio" class="visual-stage" hidden>', '<main id="inicio" class="visual-stage">')
          qa_script = r'''
          <style>#auth-gate{display:none!important}</style>
          <script>
          addEventListener('load', () => {
            const desktop = innerWidth >= 801;
            const panel = document.querySelector('.form-layer');
            const ids = ['solicitante','cpf','telefone','contrato','parcel-mode-select','consentimento','submit-button'];
            const failures = [];
            const inside = (r, outer, pad = 1) => r.left >= outer.left-pad && r.right <= outer.right+pad && r.top >= outer.top-pad && r.bottom <= outer.bottom+pad;
            if (desktop) {
              const pr = panel.getBoundingClientRect();
              if (pr.left < -2 || pr.top < -2 || pr.right > innerWidth+2 || pr.bottom > innerHeight+2) failures.push('panel-outside');
              for (const id of ids) {
                const el = document.getElementById(id);
                if (!el) { failures.push('missing-'+id); continue; }
                const r = el.getBoundingClientRect();
                if (r.width < 8 || r.height < 8) failures.push('collapsed-'+id);
                if (!inside(r, pr, 3)) failures.push('outside-'+id);
              }
            }
            document.documentElement.dataset.qa = failures.length ? 'fail-' + failures.join('-') : 'ok';
          });
          </script>
          '''
          html = html.replace('</head>', qa_script + '</head>')
          Path("_qa-preview-v10.html").write_text(html, encoding="utf-8")
          PY

      - name: Testar viewport em Chrome desktop e mobile
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "ERRO: Chromium/Chrome nao encontrado no runner"
            exit 1
          fi

          mkdir -p qa-v10
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/v10-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 2

          curl --fail --silent --show-error http://127.0.0.1:8765/assets/login-portal-full-v8.5.7.webp -o /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8765/emissao-v10.0.0.css -o /dev/null

          check_layout () {
            local size="$1"
            local dump
            dump="$("$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size="$size" --dump-dom http://127.0.0.1:8765/_qa-preview-v10.html#solicitar 2>/dev/null)"
            if ! grep -q 'data-qa="ok"' <<< "$dump"; then
              echo "ERRO: geometria invalida em $size"
              grep -o 'data-qa="[^"]*"' <<< "$dump" || true
              exit 1
            fi
          }

          check_layout 1365,695
          check_layout 1920,1080
          check_layout 2560,1080

          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1365,695 --screenshot=qa-v10/preview-1365x695.png http://127.0.0.1:8765/_qa-preview-v10.html#solicitar
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1920,1080 --screenshot=qa-v10/preview-1920x1080.png http://127.0.0.1:8765/_qa-preview-v10.html#solicitar
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=2560,1080 --screenshot=qa-v10/preview-2560x1080.png http://127.0.0.1:8765/_qa-preview-v10.html#solicitar
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --screenshot=qa-v10/preview-mobile-390x844.png http://127.0.0.1:8765/_qa-preview-v10.html#solicitar

          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageStat

          expected = {
              "preview-1365x695.png": (1365, 695),
              "preview-1920x1080.png": (1920, 1080),
              "preview-2560x1080.png": (2560, 1080),
              "preview-mobile-390x844.png": (390, 844),
          }

          for name, size in expected.items():
              path = Path("qa-v10") / name
              with Image.open(path) as image:
                  image.load()
                  if image.size != size:
                      raise SystemExit(f"Screenshot {name} com tamanho {image.size}, esperado {size}")
                  gray = image.convert("L")
                  stat = ImageStat.Stat(gray)
                  mean, stddev = stat.mean[0], stat.stddev[0]
                  if mean < 7 or stddev < 8:
                      raise SystemExit(f"Screenshot {name} parece vazio/preto: media={mean:.2f}, desvio={stddev:.2f}")

                  if image.width >= 801:
                      edge_w = max(8, image.width // 24)
                      for side, box in {
                          "left": (0, 0, edge_w, image.height),
                          "right": (image.width-edge_w, 0, image.width, image.height),
                      }.items():
                          edge = gray.crop(box)
                          values = list(edge.getdata())
                          near_black = sum(v <= 3 for v in values) / len(values)
                          edge_std = ImageStat.Stat(edge).stddev[0]
                          if near_black > .985 and edge_std < 3:
                              raise SystemExit(
                                  f"Faixa lateral preta detectada em {name}/{side}: "
                                  f"near_black={near_black:.3f}, desvio={edge_std:.2f}"
                              )
                  print(f"{name}: mean={mean:.2f} stddev={stddev:.2f} OK")
          PY

      - name: Guardar screenshots de conferencia
        uses: actions/upload-artifact@v4
        with:
          name: qa-viewport-v10-${{ github.sha }}
          path: qa-v10/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Preparar pacote limpo do site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            --exclude '_qa-preview-v10.html' \
            --exclude 'qa-v10' \
            --exclude '*.b64' \
            --exclude 'part-*.bin' \
            --exclude 'assets/emissao-v10.0.0' \
            --exclude 'assets/emissao-v10.0.0-src' \
            ./ _site/

          test -f _site/assets/login-portal-full-v8.5.7.webp
          test -f _site/emissao-v10.0.0.css
          test -f _site/emissao-v10.0.0.js

          if find _site -type f \( -name '*.b64' -o -name 'part-*.bin' \) -print -quit | grep -q .; then
            echo "ERRO: fragmentos de teste vazaram para o pacote publicado"
            exit 1
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empacotar site validado
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

  deploy:
    name: Publicar site
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write
      actions: read

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
