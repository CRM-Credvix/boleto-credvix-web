name: Publicar Boleto Credvix

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  VIEWPORT_ASSET: assets/emissao-portal-wide-v9.2.3.avif
  SOURCE_REF: refs/remotes/origin/agent/publicar-viewport-v9-2-2
  SOURCE_ASSET: assets/emissao-portal-wide-v9.1.0.avif
  EXPECTED_SIZE: "169800"
  EXPECTED_SHA256: fd39453584c7005dad4d13c17b5a02cb4caa302e1d3ded820ffd5a44f416e1de

jobs:
  build:
    name: Preparar e validar site
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recuperar viewport aprovada de forma deterministica
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          git show "${SOURCE_REF}:${SOURCE_ASSET}" > "${VIEWPORT_ASSET}"
          test "$(wc -c < "${VIEWPORT_ASSET}" | tr -d ' ')" = "${EXPECTED_SIZE}"
          echo "${EXPECTED_SHA256}  ${VIEWPORT_ASSET}" | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          import os, struct
          p = Path(os.environ['VIEWPORT_ASSET'])
          b = p.read_bytes()
          assert b[4:8] == b'ftyp' and b'avif' in b[:32], 'arquivo nao e AVIF valido'
          pos = b.find(b'ispe')
          assert pos >= 0, 'ispe ausente'
          width, height = struct.unpack('>II', b[pos+8:pos+16])
          assert (width, height) == (1916, 821), (width, height)
          print('viewport_binary=PASS')
          print('dimensions=PASS', width, height)
          PY

      - name: Montar emissao limpa v9.2.3
        shell: bash
        run: |
          set -euo pipefail
          cp emissao-v8.9.0.css emissao-v9.2.3.css
          sed -i 's/v8.9.0 - Viewport wide definitivo/v9.2.3 - Viewport steampunk wide aprovada/' emissao-v9.2.3.css

          cat > emissao-v9.2.3.js <<'EOF'
          (() => {
            "use strict";

            const parcelSelect = document.querySelector("#parcel-mode-select");
            const emissionLogout = document.querySelector("#emissao-logout");
            const authLogout = document.querySelector("#auth-logout");
            const requestForm = document.querySelector("#request-form");

            if (parcelSelect) {
              parcelSelect.addEventListener("change", () => {
                const value = parcelSelect.value;
                if (!value) return;
                document.querySelector(`input[name="tipoSolicitacao"][value="${value}"]`)?.click();
              });

              document.querySelectorAll('input[name="tipoSolicitacao"]').forEach((radio) => {
                radio.addEventListener("change", () => {
                  if (radio.checked && parcelSelect.value !== radio.value) {
                    parcelSelect.value = radio.value;
                  }
                });
              });

              requestForm?.addEventListener("reset", () => {
                requestAnimationFrame(() => { parcelSelect.value = ""; });
              });
            }

            if (emissionLogout && authLogout) {
              emissionLogout.addEventListener("click", () => authLogout.click());
            }
          })();
          EOF

          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          text = text.replace('emissao-v8.9.0.css?v=1', 'emissao-v9.2.3.css?v=1')
          text = text.replace('emissao-v8.9.0.js?v=2', 'emissao-v9.2.3.js?v=1')
          text = re.sub(
              r'(<img\s+class="desktop-mock"\s+src=")[^"]+("[^>]*>)',
              r'\1assets/emissao-portal-wide-v9.2.3.avif?v=1\2',
              text,
              count=1,
              flags=re.S,
          )
          anchor = '  <link rel="preload" href="assets/login-portal-full-v8.5.7.webp" as="image" type="image/webp">\n'
          preload = '  <link rel="preload" href="assets/emissao-portal-wide-v9.2.3.avif?v=1" as="image" type="image/avif" media="(min-width: 801px)">\n'
          assert anchor in text
          text = text.replace(anchor, anchor + preload, 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Validar integracao final
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          js = Path('emissao-v9.2.3.js').read_text(encoding='utf-8')
          css = Path('emissao-v9.2.3.css').read_text(encoding='utf-8')

          m = re.search(r'<img\s+class="desktop-mock"\s+src="([^"]+)"', html, re.S)
          assert m and m.group(1) == 'assets/emissao-portal-wide-v9.2.3.avif?v=1'
          assert 'emissao-v9.2.3.css?v=1' in html
          assert 'emissao-v9.2.3.js?v=1' in html
          assert 'emissao-v8.9.0.js?v=2' not in html
          assert 'fetch(' not in js
          assert 'data:image/' not in js
          assert 'WIDE_ART_SOURCE' not in js
          assert 'pixel-neon-whatsapp-desktop-colmeia-solar-v8.3.0.webp' not in m.group(0)
          assert '.visual-stage::before' in css and 'display: none !important' in css

          ratio = 1916 / 821
          panel = (770, 80, 1148, 650)
          for vw, vh in [(1366,641),(1366,768),(1440,900),(1600,900),(1920,1080),(2560,1080)]:
              sw = max(vw, vh * ratio)
              sh = max(vh, vw / ratio)
              assert sw >= vw and sh >= vh
              scale = sw / 1916
              cx = max(0.0, (sw-vw)/2/scale)
              cy = max(0.0, (sh-vh)/2/scale)
              visible = (cx, cy, 1916-cx, 821-cy)
              assert panel[0] >= visible[0] and panel[2] <= visible[2]
              assert panel[1] >= visible[1] and panel[3] <= visible[3]

          print('direct_binary_asset=PASS')
          print('no_runtime_base64=PASS')
          print('no_neon_fallback=PASS')
          print('geometry_6_viewports=PASS')
          PY

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empacotar site validado
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

  deploy:
    name: Publicar site
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
