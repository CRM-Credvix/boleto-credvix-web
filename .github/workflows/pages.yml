name: Publicar Boleto Credvix

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: https://crm-credvix.github.io/boleto-credvix-web/

    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v6

      - name: Conferir se o site ja esta atualizado
        id: published
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="https://crm-credvix.github.io/boleto-credvix-web"
          MATCHES=true
          FILE_LIST="${RUNNER_TEMP}/site-files"
          REMOTE_FILE="${RUNNER_TEMP}/published-file"

          find . -type f \
            ! -path './.git/*' \
            ! -path './.github/*' \
            ! -path './.*' \
            -print0 > "${FILE_LIST}"

          while IFS= read -r -d '' FILE; do
            RELATIVE_PATH="${FILE#./}"

            if ! curl -fsS --retry 4 --retry-delay 3 \
              "${BASE_URL}/${RELATIVE_PATH}?commit=${GITHUB_SHA}" \
              -o "${REMOTE_FILE}"; then
              MATCHES=false
              break
            fi

            if ! cmp -s "${FILE}" "${REMOTE_FILE}"; then
              MATCHES=false
              break
            fi
          done < "${FILE_LIST}"

          echo "matches=${MATCHES}" >> "${GITHUB_OUTPUT}"

      - name: Configurar GitHub Pages
        if: steps.published.outputs.matches != 'true'
        uses: actions/configure-pages@v5

      - name: Preparar arquivos do site
        if: steps.published.outputs.matches != 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Publicar site
        id: deployment
        if: steps.published.outputs.matches != 'true'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Confirmar publicacao apos falha da API
        if: steps.deployment.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="https://crm-credvix.github.io/boleto-credvix-web"
          FILE_LIST="${RUNNER_TEMP}/site-files"
          REMOTE_FILE="${RUNNER_TEMP}/published-file"

          find . -type f \
            ! -path './.git/*' \
            ! -path './.github/*' \
            ! -path './.*' \
            -print0 > "${FILE_LIST}"

          for ATTEMPT in $(seq 1 30); do
            MATCHES=true

            while IFS= read -r -d '' FILE; do
              RELATIVE_PATH="${FILE#./}"

              if ! curl -fsS --retry 2 --retry-delay 2 \
                "${BASE_URL}/${RELATIVE_PATH}?commit=${GITHUB_SHA}&attempt=${ATTEMPT}" \
                -o "${REMOTE_FILE}" || ! cmp -s "${FILE}" "${REMOTE_FILE}"; then
                MATCHES=false
                break
              fi
            done < "${FILE_LIST}"

            if [[ "${MATCHES}" == "true" ]]; then
              echo "O conteúdo público corresponde integralmente ao commit."
              exit 0
            fi

            sleep 10
          done

          echo "O conteúdo público ainda não corresponde ao commit."
          exit 1
