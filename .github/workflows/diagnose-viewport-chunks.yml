name: Diagnosticar fragmentos viewport

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/diagnose-viewport-chunks.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Inspecionar fragmentos
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          : > viewport-chunks-diagnostic.txt
          blobs=(
            8a2a13db96c9be8464ebead8bfa2570e3acafc34
            8316032612a136fb09884f4f34a2f1996b788e65
            3c1544d42cdb56e6f614468299d5017a207df440
            1f6f5ff15548dd727206f141899b9e7083c52fe3
            f7bed33784584bf2ba0753974f16a190dc03deb5
            3980463a570ac03232f32899865bc493db79dc01
            0e9ba01f46a4e1edd443be4effdcf80dbec7ea5e
            bf1666c25671f93b2cc73883732b16de8bef73a2
            60da9d564175cef82ade314af1950aac66d79a59
            067880c7cfc1196dffa96e2c06775d8e8d53f33a
            772dcd7528be0efbcf015753c6ad7ef05078c6bc
            579e7838bbe406e4afde9fb232723a4ad198d9aa
          )
          i=0
          for sha in "${blobs[@]}"; do
            json="/tmp/b${i}.json"
            raw="/tmp/b${i}.raw"
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" > "$json"
            python3 - "$json" "$raw" "$sha" "$i" <<'PY' >> viewport-chunks-diagnostic.txt
          import sys,json,base64,re
          j,out,sha,idx=sys.argv[1:]
          obj=json.load(open(j,encoding='utf-8'))
          data=base64.b64decode(obj['content'])
          open(out,'wb').write(data)
          clean=b''.join(data.split())
          valid=bool(re.fullmatch(rb'[A-Za-z0-9+/=]*',clean))
          print(f'idx={idx} sha={sha} size={len(data)} clean={len(clean)} ascii_base64={valid} first_hex={data[:12].hex()} last_hex={data[-12:].hex()}')
          if valid:
              print(' first_text='+clean[:20].decode('ascii','replace')+' last_text='+clean[-20:].decode('ascii','replace'))
          PY
            i=$((i+1))
          done
          python3 - <<'PY' >> viewport-chunks-diagnostic.txt
          from pathlib import Path
          import re
          chunks=[Path(f'/tmp/b{i}.raw').read_bytes() for i in range(12)]
          text=b''.join(chunks)
          clean=b''.join(text.split())
          bad=sorted(set(clean)-set(b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/='))
          print('combined_size='+str(len(text)))
          print('combined_clean='+str(len(clean)))
          print('combined_mod4='+str(len(clean)%4))
          print('bad_bytes='+','.join(map(str,bad)))
          for i,b in enumerate(clean):
              if b not in b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=':
                  print('first_bad_offset='+str(i)+' byte='+str(b))
                  break
          PY
      - name: Salvar diagnostico
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add viewport-chunks-diagnostic.txt
          git commit -m "Registrar diagnostico dos fragmentos da viewport"
          git push origin HEAD:main
