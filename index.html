<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#030615">
  <title>Boleto Credvix</title>
  <link rel="stylesheet" href="styles.css?v=6.0.0">
</head>
<body>
  <main id="stageShell" class="stage-shell" aria-label="Boleto Credvix">
    <section id="stage" class="stage">
      <img class="mock-base" src="assets/mock-aprovado.png" alt="" draggable="false">

      <nav class="hotspot-nav" aria-label="Navegação principal">
        <button type="button" class="nav-hotspot nav-how" data-action="how" aria-label="Como Funciona"></button>
        <button type="button" class="nav-hotspot nav-request" data-action="request" aria-label="Solicitar"></button>
        <button type="button" class="nav-hotspot nav-help" data-action="help" aria-label="Dúvidas"></button>
        <button type="button" class="nav-hotspot nav-security" data-action="security" aria-label="Segurança"></button>
      </nav>

      <form id="boletoForm" class="form-overlay" novalidate>
        <label class="sr-only" for="nome">Nome completo</label>
        <input id="nome" name="nome" class="overlay-field field-name" type="text" autocomplete="name" maxlength="80" placeholder="Digite seu nome completo">

        <label class="sr-only" for="unidade">Unidade</label>
        <select id="unidade" name="unidade" class="overlay-field field-unit" autocomplete="organization">
          <option value="">Selecione sua unidade</option>
          <option>Matriz</option>
          <option>Filial 1</option>
          <option>Filial 2</option>
        </select>

        <label class="sr-only" for="telefone">Telefone WhatsApp</label>
        <input id="telefone" name="telefone" class="overlay-field field-phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="15" placeholder="(11) 91234-5678">

        <label class="sr-only" for="cpf">CPF</label>
        <input id="cpf" name="cpf" class="overlay-field field-cpf" type="text" inputmode="numeric" autocomplete="off" maxlength="14" placeholder="000.000.000-00">

        <label class="sr-only" for="contrato">Contrato opcional</label>
        <input id="contrato" name="contrato" class="overlay-field field-contract" type="text" inputmode="numeric" autocomplete="off" maxlength="30" placeholder="Informe o número do contrato">

        <fieldset class="option-group" aria-label="Escolha a parcela">
          <legend class="sr-only">Escolha a parcela</legend>
          <label class="option-card option-first is-selected">
            <input type="radio" name="tipoParcela" value="primeira" checked>
            <span class="option-radio"></span>
            <span class="option-copy"><strong>Primeira disponível</strong><small>Seleciona a menor parcela habilitada.</small></span>
            <span class="gems gems-yellow"><i></i></span>
          </label>
          <label class="option-card option-specific">
            <input type="radio" name="tipoParcela" value="especifica">
            <span class="option-radio"></span>
            <span class="option-copy"><strong>Parcela específica</strong><small>Escolha uma única parcela.</small></span>
            <span class="gems gems-blue"><i></i><i></i></span>
          </label>
          <label class="option-card option-range">
            <input type="radio" name="tipoParcela" value="intervalo">
            <span class="option-radio"></span>
            <span class="option-copy"><strong>Intervalo de parcelas</strong><small>Escolha duas ou mais parcelas consecutivas.</small></span>
            <span class="gems gems-pink"><i></i><i></i><i></i></span>
          </label>
        </fieldset>

        <label class="consent-hitbox">
          <input id="consentimento" name="consentimento" type="checkbox">
          <span class="custom-check" aria-hidden="true"></span>
          <span class="sr-only">Confirmo que os dados foram conferidos e autorizo o uso para emissão e envio do boleto.</span>
        </label>

        <button id="submitButton" class="submit-overlay" type="submit">
          <span>GERAR BOLETO E ENVIAR NO WHATSAPP</span>
          <span class="button-arrow" aria-hidden="true">→</span>
        </button>
      </form>

      <div id="parcelModal" class="modal" hidden>
        <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
          <button type="button" class="modal-close" data-close-modal aria-label="Fechar">×</button>
          <h2 id="modalTitle">Definir parcelas</h2>
          <p id="modalHint">Informe a parcela desejada.</p>
          <div id="specificFields" class="modal-fields">
            <label for="parcelaEspecifica">Número da parcela</label>
            <input id="parcelaEspecifica" type="number" min="1" max="999" inputmode="numeric">
          </div>
          <div id="rangeFields" class="modal-fields" hidden>
            <label for="parcelaInicial">Parcela inicial</label>
            <input id="parcelaInicial" type="number" min="1" max="999" inputmode="numeric">
            <label for="parcelaFinal">Parcela final</label>
            <input id="parcelaFinal" type="number" min="1" max="999" inputmode="numeric">
          </div>
          <button type="button" class="modal-confirm" data-confirm-modal>Confirmar parcelas</button>
        </div>
      </div>

      <div id="infoModal" class="modal" hidden>
        <div class="modal-card info-card" role="dialog" aria-modal="true" aria-labelledby="infoTitle">
          <button type="button" class="modal-close" data-close-info aria-label="Fechar">×</button>
          <h2 id="infoTitle">Boleto Credvix</h2>
          <p id="infoText"></p>
          <button type="button" class="modal-confirm" data-close-info>Entendi</button>
        </div>
      </div>

      <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="app.js?v=6.0.0"></script>
</body>
</html>
